services:
  - type: web
    name: lovematch-bot
    runtime: python
    rootDir: lovematch_bot
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lovematch-db
          property: connectionString
      - key: ADMIN_IDS
        sync: false
      - key: PAYMENT_PROVIDER
        value: test
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: CHAT_PRICE
        value: "5000"

databases:
  - name: lovematch-db
    plan: free
